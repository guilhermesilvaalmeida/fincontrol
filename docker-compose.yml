version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: fincontrol
      POSTGRES_USER: fincontrol
      POSTGRES_PASSWORD: fincontrol
    ports:
      - "5432:5432"
    volumes:
      - fincontrol_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fincontrol"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/fincontrol
      DATABASE_USERNAME: fincontrol
      DATABASE_PASSWORD: fincontrol
      JWT_SECRET: ${JWT_SECRET:-change-this-secret-in-production-please-0123456789}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      SPRING_PROFILES_ACTIVE: dev
    ports:
      - "8080:8080"

volumes:
  fincontrol_pgdata:
